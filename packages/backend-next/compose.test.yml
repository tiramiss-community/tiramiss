services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: foundation-test-only
      POSTGRES_DB: backend_next_test
    ports:
      - '127.0.0.1:${BACKEND_NEXT_TEST_DB_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d backend_next_test']
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8
    ports:
      - '127.0.0.1:${BACKEND_NEXT_TEST_REDIS_PORT:-56379}:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30
